<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" role="img" aria-label="Trend Detective Spain — Earth System &amp; Energy Intelligence">
  <defs>
    <linearGradient id="logo-bg" x1="12" y1="10" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="logo-ring" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cc4ff" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f5c26b" />
    </linearGradient>
    <linearGradient id="logo-energy" x1="28" y1="82" x2="90" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cc4ff" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ff8a80" />
    </linearGradient>
    <linearGradient id="logo-cone" x1="64" y1="52" x2="92" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5c26b" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#f5c26b" stop-opacity="0.04" />
    </linearGradient>
    <radialGradient id="logo-glow" cx="72%" cy="26%" r="40%">
      <stop offset="0%" stop-color="#f5c26b" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f5c26b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Emblem Container -->
  <g transform="translate(8, 8)">
    <rect x="4" y="4" width="96" height="96" rx="26" fill="url(#logo-bg)" />
    <rect x="5" y="5" width="94" height="94" rx="25" stroke="url(#logo-ring)" stroke-opacity="0.45" stroke-width="2" />
    <circle cx="52" cy="52" r="42" fill="url(#logo-glow)" />

    <!-- Earth Observation Globe Grid -->
    <circle cx="49" cy="50" r="31" stroke="#7cc4ff" stroke-opacity="0.22" stroke-width="1.75" />
    <ellipse cx="49" cy="50" rx="16.5" ry="31" stroke="#7cc4ff" stroke-opacity="0.16" stroke-width="1.5" />
    <path d="M20 41H78M20 59H78" stroke="#7cc4ff" stroke-opacity="0.14" stroke-width="1.5" stroke-linecap="round" />

    <!-- Hydro & Wind Energy Wave -->
    <path
      d="M23 61C31 55.5 39 55.5 46.5 61C54 66.5 62 66.5 71 59.5"
      stroke="#7cc4ff"
      stroke-opacity="0.7"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- 2030 Sen's Slope Confidence Cone -->
    <path d="M55 44L77 24L77 41Z" fill="url(#logo-cone)" />

    <!-- Ascending Energy & Climate Trend Curve -->
    <path
      d="M25 65L38 54.5L46.5 58L58 41.5L75 29.5"
      stroke="url(#logo-energy)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Energy Pulse Bolt Accent at Pivot -->
    <path
      d="M54 32L48.5 40.5H54.5L50.5 48.5"
      stroke="#f5c26b"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Data / Horizon Nodes -->
    <circle cx="38" cy="54.5" r="3.2" fill="#7cc4ff" />
    <circle cx="58" cy="41.5" r="3.5" fill="#e8edf3" />
    <circle cx="75" cy="29.5" r="5" fill="#f5c26b" />
    <circle cx="75" cy="29.5" r="8.5" stroke="#f5c26b" stroke-opacity="0.4" stroke-width="1.6" />

    <!-- Detective Magnifying Rim & Handle -->
    <circle cx="49" cy="50" r="31" stroke="url(#logo-ring)" stroke-width="3.2" />
    <path d="M72 73L87 88" stroke="url(#logo-ring)" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(128, 0)">
    <text
      x="0"
      y="36"
      fill="#7cc4ff"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      font-weight="600"
      letter-spacing="2.8"
    >
      SPAIN ENERGY &amp; CLIMATE · 2000–2030
    </text>
    <text
      x="0"
      y="68"
      fill="#e8edf3"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="28"
      font-weight="700"
      letter-spacing="-0.6"
    >
      Trend Detective
    </text>
    <text
      x="220"
      y="68"
      fill="#f5c26b"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="28"
      font-weight="500"
      letter-spacing="-0.4"
    >
      / Iberia
    </text>
    <text
      x="0"
      y="92"
      fill="#9aa8b8"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="13"
      font-weight="400"
    >
      Earth Observation · Hydro, Wind &amp; Thermal Grid Trends
    </text>
  </g>
</svg>
