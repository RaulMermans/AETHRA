name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests (science, evidence chain, release guards)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # tests/test_aethra_agent.py runs the TARO policy cases with `node --experimental-strip-types` (Node >= 22.6).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: pip install -r requirements-test.txt

      # Two tests read raw inputs that .gitignore keeps out of the repo (*.tif, *.nc), so they can
      # only run on a machine with the downloaded data (see docs/DATASETS.md). Everything else runs.
      - name: pytest
        run: >
          python -m pytest -q packages/science tests
          --deselect tests/test_cvd_palettes.py::test_miteco_cvd_pngs_match_rasters
          --deselect tests/test_pv_screening.py::test_numbers_reproducible_for_sample_cells

      # Advisory until the existing backlog is cleaned up (106 findings on 15 Nov 2026).
      - name: ruff (advisory)
        continue-on-error: true
        run: ruff check packages scripts tests services --output-format=github

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Judge build: NEXT_PUBLIC_ENABLE_EXPLORATORY is deliberately unset.
      - run: npm run build
