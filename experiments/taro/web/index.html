<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TARO experimental viewer</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; background: #e8e4dc; color: #142033; }
      header, footer { padding: 0.75rem 1rem; }
      header p, footer { max-width: 46rem; font-size: 0.9rem; }
      .stage { display: grid; grid-template-columns: minmax(0, 1fr) 16rem; gap: 0.75rem; padding: 0 1rem 1rem; }
      canvas, img { width: 100%; height: min(78vh, 820px); background: #e8e4dc; border-radius: 12px; }
      nav { display: flex; flex-direction: column; gap: 0.4rem; }
      button { text-align: left; border: 1px solid #8d97a3; background: #f7f5f1; border-radius: 8px; padding: 0.45rem 0.6rem; }
      button[aria-pressed="true"] { border-color: #0b1e3a; background: #d7f7ff; }
      @media (max-width: 800px) { .stage { grid-template-columns: 1fr; } }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <header>
      <h1>TARO <small>experimental</small></h1>
      <p>
        Isolated 3D study. Not part of AETHRA Core and not a scientific result.
        States only change the character. They do not judge a trend.
      </p>
    </header>
    <div class="stage">
      <div>
        <canvas></canvas>
        <img data-fallback hidden src="../renders/front.png" alt="TARO front view, rendered from the 3D model" />
        <p data-status>Loading the GLB…</p>
      </div>
      <nav aria-label="TARO visual states">
        <button type="button" data-state="idle" aria-pressed="true">Idle</button>
        <button type="button" data-state="greeting">Greeting</button>
        <button type="button" data-state="listening">Listening</button>
        <button type="button" data-state="thinking">Thinking</button>
        <button type="button" data-state="explaining">Explaining</button>
        <button type="button" data-state="discovery">Discovery</button>
        <button type="button" data-state="insufficient">Insufficient evidence</button>
        <button type="button" data-state="error">Error</button>
        <button type="button" data-state="guiding">Guiding</button>
        <button type="button" data-turn>Turn 90°</button>
      </nav>
    </div>
    <footer>
      Source <code>experiments/taro/source/taro.blend</code>.
      Web asset <code>experiments/taro/export/taro.glb</code>.
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
